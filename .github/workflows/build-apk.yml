name: Build & Download Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK for Easy Identification
        run: |
          mkdir -p apk_output
          cp app/build/outputs/apk/debug/*.apk apk_output/REWIVO-AI-debug.apk || cp app/build/outputs/apk/debug/app-debug.apk apk_output/REWIVO-AI-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: REWIVO-AI-Android-APK
          path: apk_output/REWIVO-AI-debug.apk
          if-no-files-found: error
          retention-days: 30
