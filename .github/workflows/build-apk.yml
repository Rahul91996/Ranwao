name: Build & Download Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create .env from template
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          elif [ ! -f .env ]; then
            touch .env
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK for Artifact
        run: |
          mkdir -p apk_output
          find app/build/outputs/apk/debug -name "*.apk" -exec cp {} apk_output/REWIVO-AI-debug.apk \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: REWIVO-AI-Android-APK
          path: apk_output/REWIVO-AI-debug.apk
          if-no-files-found: error
          retention-days: 30
